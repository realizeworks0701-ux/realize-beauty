# Render Blueprint — Realize Beauty API + PostgreSQL
# 使い方: Render ダッシュボード → New → Blueprint → このリポジトリを選択。
# sync: false の変数はデプロイ後にダッシュボードで手入力する（機密情報）。

databases:
  - name: realize-beauty-db
    databaseName: realize_beauty
    user: realize_beauty
    plan: free # 無料枠は期限あり. 本番運用時は有料プランへ

services:
  - type: web
    name: realize-beauty-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Realize Beauty
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # php artisan key:generate --show で生成した値を貼る
      - key: APP_KEY
        sync: false
      # デプロイ後に払い出される API のURL（例 https://realize-beauty-api.onrender.com）
      - key: APP_URL
        sync: false

      # ログは Render のログストリーム（stderr）へ。既定の stack→single は
      # コンテナの一時ディスクに書くため再デプロイで消え、参照もできない。
      - key: LOG_CHANNEL
        value: stderr
      # 既定の debug は SQL バインド値などを含む詳細ログが出るため info に絞る
      - key: LOG_LEVEL
        value: info

      # 営業日の境界計算に使う（config/app.php salon_timezone）。既定値と同じだが本番では明示する
      - key: SALON_TIMEZONE
        value: Asia/Tokyo

      # artisan serve は既定で1リクエストずつ直列処理する。外部API（OpenAI/Google/LINE）待ちが
      # ヘルスチェックまで巻き込むため複数ワーカーにする（entrypoint の --no-reload が前提）。
      - key: PHP_CLI_SERVER_WORKERS
        value: '4'

      # Sanctum トークンの有効期限（分）。既定は無期限のため明示する
      - key: SANCTUM_EXPIRATION
        value: '720'

      # 写真の署名付きURLの有効期間（分）
      - key: PHOTO_URL_TTL_MINUTES
        value: '60'

      # DB接続のTLS要求。既定の prefer はサーバがTLSを提供しないと平文にフォールバックする。
      # !! 未検証のまま有効化すると entrypoint の `set -e` + `migrate --force` で起動不能＝全断する
      #    （ローカルのTLS無効postgresで ExitCode=1 を再現済み）。
      #    docs/runbook-hardening.md の手順1で疎通確認したうえで、以下のコメントを外して再デプロイするか
      #    Render ダッシュボードの Environment で DB_SSLMODE=require を設定すること。
      # - key: DB_SSLMODE
      #   value: require

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: realize-beauty-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: realize-beauty-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: realize-beauty-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: realize-beauty-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: realize-beauty-db
          property: password

      # Cloudflare Pages のURLをカンマ区切りで（例 https://realize-beauty.pages.dev）
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # 写真は Cloudflare R2（ADR-005）
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # AI要約はデプロイ後に有効化（キー未設定でもアプリは動作する）
      - key: OPENAI_API_KEY
        sync: false

      # Google カレンダー連携（ADR-025）。OAuth 資格情報はデプロイ後にダッシュボードで入力する。
      # Google Cloud の OAuth クライアントに、承認済みリダイレクト URI として
      # {APP_URL}/api/v1/google-calendar/callback を登録すること。
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # OAuth コールバック後の SPA 戻り先。Cloudflare Pages の URL を入れる
      # （例 https://realize-beauty.pages.dev）。未設定だと APP_URL にフォールバックし戻れない。
      - key: FRONTEND_URL
        sync: false
