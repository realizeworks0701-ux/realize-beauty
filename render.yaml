# Render Blueprint — Realize Beauty API + PostgreSQL
# 使い方: Render ダッシュボード → New → Blueprint → このリポジトリを選択。
# sync: false の変数はデプロイ後にダッシュボードで手入力する（機密情報）。

# 以下の値は 2026-09-07 にダッシュボードの Generate Blueprint で書き出した実設定と
# 突き合わせて確定させた。Blueprint 同期はファイル全体を適用してダッシュボードの設定を
# 上書きするため、実態とずれた値を書くと本番を壊す。変更するときは必ず先に突き合わせること
# （手順は docs/runbook-develop-env.md の STEP 0）。
databases:
  - name: realize-beauty-db
    databaseName: realize_beauty
    user: realize_beauty
    plan: 0.1c-256mb
    # region は作成後に変更できない。実態と同じ値を明示する
    region: oregon
    # 縮小できない一方向の値。実態と同じにしておく
    diskSizeGB: 1
    postgresMajorVersion: "18"
    # !! 全インターネットに開いている。ローカルから DB_URL で運用コマンドを叩く運用
    #    （Shell が無いため）に必要ではあるが範囲が最大。固定IPを用意できたら絞ること。
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: realize-beauty-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: oregon
    # branch は develop サービスを足すため明示する。省略時はリポジトリの
    # 既定ブランチを指す暗黙の挙動になり、兄弟サービスが増えると読み解けない。
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Realize Beauty
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      # 利用者に見えるバリデーションメッセージは日本語で返す（lang/ja）
      - key: APP_LOCALE
        value: ja
      # php artisan key:generate --show で生成した値を貼る
      - key: APP_KEY
        sync: false
      # デプロイ後に払い出される API のURL（例 https://realize-beauty-api.onrender.com）
      - key: APP_URL
        sync: false

      # ログは Render のログストリーム（stderr）へ。既定の stack→single は
      # コンテナの一時ディスクに書くため再デプロイで消え、参照もできない。
      - key: LOG_CHANNEL
        value: stderr
      # 既定の debug は SQL バインド値などを含む詳細ログが出るため info に絞る
      - key: LOG_LEVEL
        value: info

      # 営業日の境界計算に使う（config/app.php salon_timezone）。既定値と同じだが本番では明示する
      - key: SALON_TIMEZONE
        value: Asia/Tokyo

      # artisan serve は既定で1リクエストずつ直列処理する。外部API（OpenAI/Google/LINE）待ちが
      # ヘルスチェックまで巻き込むため複数ワーカーにする（entrypoint の --no-reload が前提）。
      - key: PHP_CLI_SERVER_WORKERS
        value: '4'

      # Sanctum トークンの有効期限（分）。既定は無期限のため明示する
      - key: SANCTUM_EXPIRATION
        value: '720'

      # 写真の署名付きURLの有効期間（分）
      - key: PHOTO_URL_TTL_MINUTES
        value: '60'

      # DB接続のTLS要求。既定の prefer はサーバがTLSを提供しないと平文にフォールバックする。
      # 2026-09-07 の実設定突き合わせで、本番には既に require が入っていることを確認した
      # （このファイルは長らくコメントアウトのままだった）。実態に合わせて明示する。
      - key: DB_SSLMODE
        value: require

      # 本番は長らく sync だった。sync はジョブの例外を再スローするため、LINE の送信が
      # 失敗すると DB::transaction を抜けて予約APIが 500 を返す。予約行は保存済みなので、
      # 利用者には「失敗した」と見えて再送信される（PublicBookingService.php:135 の
      # afterCommit dispatch → SendBookingConfirmationJob:71 の再スロー →
      # SyncQueue::handleException の throw）。LineClient はタイムアウトも例外に変換する。
      # deferred はレスポンス送出後に同一プロセスで実行するため、送信失敗はログに落ちるだけになる。
      # ワーカーを立てるまでの措置で、根本解決は type: worker の追加（runbook-hardening §6）。
      - key: QUEUE_CONNECTION
        value: deferred

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: realize-beauty-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: realize-beauty-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: realize-beauty-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: realize-beauty-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: realize-beauty-db
          property: password

      # Cloudflare Workers のURLをカンマ区切りで（例 https://realize-beauty.realizeworks-0701.workers.dev）
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # 写真は Cloudflare R2（ADR-005）
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # AI要約はデプロイ後に有効化（キー未設定でもアプリは動作する）
      - key: OPENAI_API_KEY
        sync: false

      # Google カレンダー連携（ADR-025）。OAuth 資格情報はデプロイ後にダッシュボードで入力する。
      # Google Cloud の OAuth クライアントに、承認済みリダイレクト URI として
      # {APP_URL}/api/v1/google-calendar/callback を登録すること。
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # OAuth コールバック後の SPA 戻り先。Cloudflare Workers の URL を入れる
      # （例 https://realize-beauty.realizeworks-0701.workers.dev）。未設定だと APP_URL にフォールバックし戻れない。
      - key: FRONTEND_URL
        sync: false

      # サブスクリプション課金（ADR-029）。本番は必ず Live Mode の値を入れる。
      # APP_ENV=production に Test キー（sk_test_）が入っていると、決済系APIの呼び出しは
      # 実行前に例外で止まる（機能制御そのものは Stripe 未設定でも動く）。
      # 設定後に `php artisan stripe:check` で取り違えとPrice IDの重複を確認すること。
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_KEY
        sync: false
      # 本番の Webhook エンドポイント（{APP_URL}/api/webhooks/stripe）に発行された署名シークレット。
      # DEV 用とは別の値になる。未設定だと Webhook が 400 になり契約状態が同期されない。
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Live Mode で作成した Price ID。Test Mode のものとは別で、接頭辞では判別できない。
      - key: STRIPE_PRICE_LITE
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false

  # --- develop 環境（ADR-031） -------------------------------------------
  # 見込み客に見せるデモ兼、先行検証用。本番とは DB・R2・Stripe・LINE・Google の
  # すべてを分ける。DB は Neon（無料プラン・期限なし）を DB_URL で参照するため、
  # このファイルの databases: には追加しない。
  - type: web
    name: realize-beauty-api-dev
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # 新規リソースは plan を省略すると 0.5c-512mb（有料）になる。ここは明示する。
    plan: free
    # 本番は oregon だが develop は singapore に置く。develop は日本の見込み客に
    # 見せるデモであり、Oregon だと太平洋を往復して体感が明確に遅くなる。
    # Neon のプロジェクトも AWS Singapore に作り、DB との往復を同一リージョン内に収める。
    # region は作成後に変更できないので、作る前に確認すること。
    region: singapore
    branch: develop
    # develop への push でコードが自動デプロイされる。新規サービスの既定値と同じだが、
    # 本番側と揃えて明示する（Blueprint 同期とは別の仕組みである点に注意）。
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Realize Beauty (develop)
      # production 以外にすることが Stripe テストモードの前提条件。
      # StripeClient::assertModeMatchesEnvironment() が Live キーを拒否する側に倒れる。
      # 副作用として Laravel の ConfirmableTrait も無効になり、migrate:fresh /
      # db:wipe / db:seed が確認なしで走る点に注意（demo:reset が独自ガードを持つ）。
      - key: APP_ENV
        value: staging
      # staging でも既定は false だが、見込み客に見せる環境なので明示する
      - key: APP_DEBUG
        value: 'false'
      - key: APP_LOCALE
        value: ja
      # 本番とは必ず別の値にする。鍵を分けておけば、万一本番のDBダンプを入れても
      # LINE/Google の暗号化列を復号できない（制約ではなく安全装置）
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SALON_TIMEZONE
        value: Asia/Tokyo
      - key: PHP_CLI_SERVER_WORKERS
        value: '4'
      - key: SANCTUM_EXPIRATION
        value: '720'
      - key: PHOTO_URL_TTL_MINUTES
        value: '60'

      # DB は Neon。接続文字列は必ず直接エンドポイント（ホスト名に -pooler を
      # 含まないもの）を使う。アプリがセッションで search_path と時刻を設定するため。
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      # DB_URL のクエリ文字列と config の既定値(prefer)が競合しないよう明示する
      - key: DB_SSLMODE
        value: require

      # キューワーカーが存在しないため、既定の database ドライバではジョブが
      # jobs テーブルに溜まったまま実行されない。sync はジョブの例外が
      # DB::transaction の外へ抜けて予約APIを 500 にするため使えない
      # （PublicBookingService.php:135）。deferred はレスポンス送出後に実行する。
      - key: QUEUE_CONNECTION
        value: deferred

      # develop フロント（Worker）のオリジン。未設定なら全拒否（フェイルクローズ）
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # 本番バケットは共用しない。R2 はバケット単位の課金がないため費用は変わらず、
      # プレフィックス分離は未設定時に fail-open して本番のキー空間に合流する。
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # 本番とは別のキーにする（AI要約はリクエスト内で同期的に課金される）
      - key: OPENAI_API_KEY
        sync: false

      # develop 専用の OAuth クライアント。
      # {APP_URL}/api/v1/google-calendar/callback を Google Cloud に登録すること。
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Stripe は named sandbox の Test Mode。sk_test_ / pk_test_ を入れる。
      # Live キーを入れると assertModeMatchesEnvironment() が例外で止める。
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_KEY
        sync: false
      # {APP_URL}/api/webhooks/stripe に対して sandbox 側で発行した値。
      # 本番の whsec を貼ると Live イベントが develop の DB に適用される。
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Test Mode 側の Price ID。Live のものとは別で、接頭辞では判別できない。
      - key: STRIPE_PRICE_LITE
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
