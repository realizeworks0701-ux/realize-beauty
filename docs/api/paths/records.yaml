records:
  get:
    tags:
      - Records
    summary: サロン全体のカルテ一覧取得
    description: >
      サロン全体のカルテ一覧。
      visited_at 降順・ページネーションあり。
      論理削除済み顧客のカルテは含まない。
    operationId: listSalonRecords
    parameters:
      - $ref: "../components/parameters.yaml#/RecordStatusFilter"
      - $ref: "../components/parameters.yaml#/Keyword"
      - $ref: "../components/parameters.yaml#/Page"
      - $ref: "../components/parameters.yaml#/PerPage"
    responses:
      '200':
        description: "カルテ一覧取得成功"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/record.yaml#/RecordCollection"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "契約プランに含まれない機能"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/FeatureRequiredResponse"
      '422':
        description: "バリデーションエラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/ValidationError"

customerRecords:
  get:
    tags:
      - Records
    summary: カルテ一覧取得
    operationId: listRecords
    parameters:
      - $ref: "../components/parameters.yaml#/CustomerId"
      - $ref: "../components/parameters.yaml#/Page"
      - $ref: "../components/parameters.yaml#/PerPage"
    responses:
      '200':
        description: "カルテ一覧取得成功"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/record.yaml#/RecordCollection"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "契約プランに含まれない機能"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/FeatureRequiredResponse"
      '404':
        description: "顧客が見つかりません"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotFound"
  post:
    tags:
      - Records
    summary: カルテ登録
    operationId: createRecord
    parameters:
      - $ref: "../components/parameters.yaml#/CustomerId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/record.yaml#/CreateRecordRequest"
    responses:
      '201':
        description: "カルテ登録成功"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/record.yaml#/RecordResponse"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "契約プランに含まれない機能"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/FeatureRequiredResponse"
      '404':
        description: "リソースが見つかりません"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotFound"
      '422':
        description: "バリデーションエラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/ValidationError"

record:
  get:
    tags:
      - Records
    summary: カルテ詳細取得
    operationId: getRecord
    parameters:
      - $ref: "../components/parameters.yaml#/RecordId"
    responses:
      '200':
        description: "カルテ詳細取得成功"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/record.yaml#/RecordResponse"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "契約プランに含まれない機能"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/FeatureRequiredResponse"
      '404':
        description: "リソースが見つかりません"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotFound"

  patch:
    tags:
      - Records
    summary: カルテ更新
    operationId: updateRecord
    parameters:
      - $ref: "../components/parameters.yaml#/RecordId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/record.yaml#/UpdateRecordRequest"
    responses:
      '200':
        description: "カルテ更新成功"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/record.yaml#/RecordResponse"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "契約プランに含まれない機能"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/FeatureRequiredResponse"
      '404':
        description: "リソースが見つかりません"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotFound"
      '422':
        description: "バリデーションエラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/ValidationError"

  delete:
    tags:
      - Records
    summary: カルテ削除
    description: Soft Delete。owner・managerのみ実行可能。
    operationId: deleteRecord
    parameters:
      - $ref: "../components/parameters.yaml#/RecordId"
    responses:
      '204':
        description: "カルテ削除成功"
      '401':
        description: "認証エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Unauthorized"
      '403':
        description: "権限エラー"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/Forbidden"
      '404':
        description: "リソースが見つかりません"
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotFound"

