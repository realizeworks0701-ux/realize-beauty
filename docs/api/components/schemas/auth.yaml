LoginRequest:
  type: object
  description: ログインリクエスト

  required:
    - email
    - password

  properties:

    email:
      type: string
      format: email
      example: admin@example.com

    password:
      type: string
      format: password
      example: password

########################################################

LoginResponse:
  type: object
  description: ログインレスポンス

  required:
    - data

  properties:

    data:
      type: object

      required:
        - token
        - user

      properties:

        token:
          type: string
          example: "1|xxxxxxxxxxxxxxxx"

        user:
          type: object

          required:
            - id
            - name
            - role

          properties:

            id:
              type: integer
              example: 1

            name:
              type: string
              example: 山田 太郎

            role:
              type: string
              enum: [owner, manager, staff]
              example: owner

            plan:
              description: 契約プラン。契約が無い・失効している場合は null
              nullable: true
              allOf:
                - $ref: "./common.yaml#/SubscriptionPlan"

            subscription_status:
              description: 契約状態。契約が無い場合は null
              nullable: true
              allOf:
                - $ref: "./common.yaml#/SubscriptionStatus"

            features:
              description: 利用可能な機能のフラグ。画面の出し分けに使う（遮断はAPIの403が担う）
              $ref: "./subscription.yaml#/FeatureFlags"

########################################################

MeResponse:
  type: object
  description: ログイン中ユーザーレスポンス

  required:
    - data

  properties:

    data:
      type: object

      required:
        - id
        - name
        - email
        - role

      properties:

        id:
          type: integer
          example: 1

        name:
          type: string
          example: 山田 太郎

        email:
          type: string
          format: email
          example: admin@example.com

        role:
          type: string
          enum: [owner, manager, staff]
          example: owner

        plan:
          description: 契約プラン。契約が無い・失効している場合は null
          nullable: true
          allOf:
            - $ref: "./common.yaml#/SubscriptionPlan"

        subscription_status:
          description: 契約状態。契約が無い場合は null
          nullable: true
          allOf:
            - $ref: "./common.yaml#/SubscriptionStatus"

        features:
          description: 利用可能な機能のフラグ。画面の出し分けに使う（遮断はAPIの403が担う）
          $ref: "./subscription.yaml#/FeatureFlags"

