CustomerId:
  name: customerId
  in: path
  required: true
  schema:
    type: integer

RecordId:
  name: recordId
  in: path
  required: true
  schema:
    type: integer

PhotoId:
  name: photoId
  in: path
  required: true
  schema:
    type: integer

MenuId:
  name: menuId
  in: path
  required: true
  schema:
    type: integer

ReservationId:
  name: reservationId
  in: path
  required: true
  schema:
    type: integer

Keyword:
  name: keyword
  in: query
  schema:
    type: string

Page:
  name: page
  in: query
  schema:
    type: integer
    default: 1

PerPage:
  name: per_page
  in: query
  schema:
    type: integer
    default: 20

Sort:
  name: sort
  in: query
  schema:
    type: string

Gender:
  name: gender
  in: query
  schema:
    type: integer
    enum:
      - 0
      - 1
      - 2
      - 9

VisitedAfter:
  name: visited_after
  in: query
  schema:
    type: string
    format: date

VisitedBefore:
  name: visited_before
  in: query
  schema:
    type: string
    format: date

MenuIsActive:
  name: is_active
  in: query
  description: true 指定で有効なメニューのみ取得
  schema:
    type: boolean

ReservationFrom:
  name: from
  in: query
  description: 期間開始日（JST）。省略時は当日
  schema:
    type: string
    format: date

ReservationTo:
  name: to
  in: query
  description: 期間終了日（JST）。省略時は from と同日。from から最大31日
  schema:
    type: string
    format: date

ReservationUserId:
  name: user_id
  in: query
  description: 担当スタッフIDで絞り込み
  schema:
    type: integer

ReservationStatusFilter:
  name: status
  in: query
  description: 予約ステータスで絞り込み
  schema:
    $ref: "./schemas/common.yaml#/ReservationStatus"
