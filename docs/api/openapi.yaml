openapi: 3.1.0

info:
  title: Realize Beauty API
  description: |
    美容サロン向けCRM「Realize Beauty」のREST API仕様です。

    API First開発を採用し、
    本ファイルをSingle Source of Truthとします。
  version: 1.0.0
  
servers:
  - url: http://localhost/api/v1
    description: Local Development

tags:
  - name: Auth
    description: 認証
  - name: Dashboard
    description: ダッシュボード
  - name: Customers
    description: 顧客管理
  - name: Records
    description: カルテ管理
  - name: Photos
    description: 写真管理
  - name: Menus
    description: メニュー管理
  - name: BusinessHours
    description: 営業時間設定
  - name: Reservations
    description: 予約管理
  - name: Users
    description: スタッフ（参照用）
  - name: LineSettings
    description: LINE連携設定
  - name: BookingPage
    description: Web予約ページ設定
  - name: GoogleCalendar
    description: Googleカレンダー連携設定
  - name: PublicBooking
    description: 公開Web予約（認証なし・/api/public/v1）
  - name: LineWebhook
    description: LINE Webhook（/api/line/webhook）
  - name: GoogleCalendarWebhook
    description: Googleカレンダー Webhook（/api/google/calendar/webhook）

security:
  - bearerAuth: []

paths:

  /auth/login:
    $ref: "./paths/auth.yaml#/login"

  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /auth/me:
    $ref: "./paths/auth.yaml#/me"

  /dashboard:
    $ref: "./paths/dashboard.yaml#/dashboard"

  /customers:
    $ref: "./paths/customers.yaml#/customers"

  /customers/{customerId}:
    $ref: "./paths/customers.yaml#/customer"

  /records:
    $ref: "./paths/records.yaml#/records"

  /customers/{customerId}/records:
    $ref: "./paths/records.yaml#/customerRecords"

  /records/{recordId}:
    $ref: "./paths/records.yaml#/record"

  /records/{recordId}/summarize:
    $ref: "./paths/records.yaml#/summarize"

  /records/{recordId}/photos:
    $ref: "./paths/photos.yaml#/upload"

  /photos/{photoId}:
    $ref: "./paths/photos.yaml#/photo"

  /menus:
    $ref: "./paths/menus.yaml#/menus"

  /menus/{menuId}:
    $ref: "./paths/menus.yaml#/menu"

  /business-hours:
    $ref: "./paths/business-hours.yaml#/businessHours"

  /reservations:
    $ref: "./paths/reservations.yaml#/reservations"

  /reservations/{reservationId}:
    $ref: "./paths/reservations.yaml#/reservation"

  /users:
    $ref: "./paths/users.yaml#/users"

  /line-settings:
    $ref: "./paths/line-settings.yaml#/lineSettings"

  /line-settings/verify:
    $ref: "./paths/line-settings.yaml#/lineSettingsVerify"

  /booking-page:
    $ref: "./paths/line-settings.yaml#/bookingPage"

  # --- Googleカレンダー連携 ---
  # callback のみ認証なし（Google からのブラウザリダイレクト・302 を返す）。
  # それ以外は /api/v1・auth:sanctum。

  /google-calendar:
    $ref: "./paths/google-calendar.yaml#/googleCalendar"

  /google-calendar/busy-blocks:
    $ref: "./paths/google-calendar.yaml#/googleCalendarBusyBlocks"

  /google-calendar/mode:
    $ref: "./paths/google-calendar.yaml#/googleCalendarMode"

  /google-calendar/auth-url:
    $ref: "./paths/google-calendar.yaml#/googleCalendarAuthUrl"

  /google-calendar/callback:
    $ref: "./paths/google-calendar.yaml#/googleCalendarCallback"

  /google-calendar/connections/{id}/calendars:
    $ref: "./paths/google-calendar.yaml#/googleCalendarConnectionCalendars"

  /google-calendar/connections/{id}:
    $ref: "./paths/google-calendar.yaml#/googleCalendarConnection"

  # --- 公開Web予約API ---
  # prefix は /api/public/v1（認証なし・throttle あり）。
  # 各 path item 側の servers がルートの servers（/api/v1）を上書きする。

  /salons/{booking_slug}:
    $ref: "./paths/public-booking.yaml#/publicSalon"

  /salons/{booking_slug}/availability:
    $ref: "./paths/public-booking.yaml#/publicAvailability"

  /salons/{booking_slug}/reservations:
    $ref: "./paths/public-booking.yaml#/publicReservations"

  /bookings/{booking_token}:
    $ref: "./paths/public-booking.yaml#/publicBooking"

  /bookings/{booking_token}/cancel:
    $ref: "./paths/public-booking.yaml#/publicBookingCancel"

  # --- LINE Webhook ---
  # prefix は /api（認証なし・throttle なし・署名検証あり）。
  # path item 側の servers がルートの servers（/api/v1）を上書きする。

  /line/webhook:
    $ref: "./paths/line-webhook.yaml#/lineWebhook"

  # --- Googleカレンダー Webhook ---
  # prefix は /api（認証なし・throttle なし・X-Goog-Channel-Token 検証あり）。
  # path item 側の servers がルートの servers（/api/v1）を上書きする。

  /google/calendar/webhook:
    $ref: "./paths/google-calendar-webhook.yaml#/googleCalendarWebhook"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
