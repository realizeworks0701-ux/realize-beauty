openapi: 3.1.0

info:
  title: Realize Beauty API
  version: 1.0.0
  description: REST API Specification

servers:
  - url: http://localhost/api/v1
    description: Local Development

tags:
  - name: Authentication
  - name: Dashboard
  - name: Customers
  - name: Records
  - name: Photos

paths:

  /auth/login:

    post:

      tags:
        - Authentication

      summary: ログイン

      operationId: login

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/LoginRequest'

      responses:

        '200':

          description: Success

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/LoginResponse'

        '401':

          description: Unauthorized

        '422':

          description: Validation Error

components:

  schemas:

    LoginRequest:

      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email

        password:
          type: string

    LoginResponse:

      type: object

      properties:

        data:

          type: object

          properties:

            token:
              type: string

            user:

              $ref: '#/components/schemas/User'

    User:

      type: object

      properties:

        id:
          type: integer

        name:
          type: string

        email:
          type: string

        role:
          type: string