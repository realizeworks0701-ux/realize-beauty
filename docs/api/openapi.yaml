openapi: 3.1.0

info:
  title: Realize Beauty API
  description: |
    美容サロン向けCRM「Realize Beauty」のREST API仕様です。

    API First開発を採用し、
    本ファイルをSingle Source of Truthとします。
  version: 1.0.0
  
servers:
  - url: http://localhost/api/v1
    description: Local Development

tags:
  - name: Auth
    description: 認証
  - name: Dashboard
    description: ダッシュボード
  - name: Customers
    description: 顧客管理
  - name: Records
    description: カルテ管理
  - name: Photos
    description: 写真管理

security:
  - bearerAuth: []

paths:

  /auth/login:
    $ref: "./paths/auth.yaml#/login"

  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /auth/me:
    $ref: "./paths/auth.yaml#/me"

  /dashboard:
    $ref: "./paths/dashboard.yaml#/dashboard"

  /customers:
    $ref: "./paths/customers.yaml#/customers"

  /customers/{customerId}:
    $ref: "./paths/customers.yaml#/customer"

  /customers/{customerId}/records:
    $ref: "./paths/records.yaml#/customerRecords"

  /records/{recordId}:
    $ref: "./paths/records.yaml#/record"

  /records/{recordId}/summarize:
    $ref: "./paths/records.yaml#/summarize"

  /records/{recordId}/photos:
    $ref: "./paths/photos.yaml#/upload"

  /photos/{photoId}:
    $ref: "./paths/photos.yaml#/photo"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
